<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà hàng PTIT - Quản lý Order</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>NHÀ HÀNG PTIT</h1>
        <p>Học hết mình - Ăn nhiệt tình</p>
    </header>

    <nav class="category-nav">
        <button class="cat-btn active" onclick="filterMenu('all')">Tất cả</button>
        <button class="cat-btn" onclick="filterMenu('mon-chinh')">Món chính</button>
        <button class="cat-btn" onclick="filterMenu('nuoc-uong')">Nước uống</button>
        <button class="cat-btn" onclick="filterMenu('do-an-kem')">Đồ ăn kèm</button>
    </nav>

    <div class="container">
        <main class="menu-section">
            <div id="menu-container" class="grid-layout"></div>
        </main>

        <aside class="order-section">
            <div class="order-header">
                <h2>Đơn hàng</h2>
                <span id="order-count">0 món</span>
            </div>
            <div id="order-list">
                <p class="empty-msg">Chưa có món nào được chọn.</p>
            </div>
            
            <div class="order-summary">
                <div class="total-row">
                    <span>Tổng tiền:</span>
                    <strong id="total-price">0 đ</strong>
                </div>
                <button id="checkout-btn" onclick="submitOrder()">CHỐT ĐƠN & THANH TOÁN</button>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
