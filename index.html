<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Order Nhà Hàng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Hệ Thống Quản Lý Đơn Gọi Món</h1>
    </header>

    <div class="container">
        <!-- Cột Thực đơn -->
        <main class="menu-section">
            <h2>Thực Đơn</h2>
            <div id="menu-container" class="grid-layout">
                <!-- Danh sách món ăn sẽ được JavaScript render tại đây -->
            </div>
        </main>

        <!-- Cột Quản lý Đơn hàng -->
        <aside class="order-section">
            <h2>Đơn Hàng Hiện Tại</h2>
            <div id="order-list">
                <p class="empty-msg">Chưa có món nào được chọn.</p>
                <!-- Các món đang chọn sẽ hiện ở đây -->
            </div>
            
            <div class="order-summary">
                <div class="total-row">
                    <span>Tổng cộng:</span>
                    <strong id="total-price">0 đ</strong>
                </div>
                <button id="checkout-btn" onclick="submitOrder()">Chốt Đơn</button>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
